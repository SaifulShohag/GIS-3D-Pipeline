<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Site Reconstruction</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: system-ui, sans-serif; background: #1a1a1a; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Overlay */
        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(20, 20, 20, 0.85); padding: 20px;
            border-radius: 8px; border: 1px solid #333; color: white;
            width: 320px; backdrop-filter: blur(4px);
        }
        input {
            width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box;
            background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px;
        }
        button {
            width: 100%; padding: 10px; background: #2563eb; color: white;
            border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #444; cursor: not-allowed; }

        /* Loading UI */
        #loading-container {
            display: none; margin-top: 15px; text-align: center; font-size: 0.9em; color: #aaa;
        }
        .progress-bar-bg {
            width: 100%; height: 6px; background: #333; border-radius: 3px;
            margin-top: 8px; overflow: hidden; position: relative;
        }
        .progress-bar-fill {
            width: 40%; height: 100%; background: #3b82f6; border-radius: 3px;
            position: absolute; animation: load-sweep 2s infinite ease-in-out;
        }
        @keyframes load-sweep {
            0% { left: -40%; }
            100% { left: 100%; }
        }
    </style>
    
    <!-- Three.js ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="ui-layer">
        <h3 style="margin-top:0;">Site Reconstruction</h3>
        <input type="text" id="address-input" placeholder="Enter property address..." value="505 Ridge Dr, Florissant, MO">
        <button id="generate-btn">Generate 3D Model</button>
        
        <div id="loading-container">
            <div>Running DUSt3R Inference (Wait ~90s)...</div>
            <div class="progress-bar-bg"><div class="progress-bar-fill"></div></div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- 1. Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);
        scene.fog = new THREE.Fog(0x1a1a1a, 20, 100);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 30); // Adjusted starting camera angle

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // Grid Reference
        const gridHelper = new THREE.GridHelper(100, 100, 0x444444, 0x222222);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        let currentModel = null;

        // --- 2. Data Fetching ---
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const address = document.getElementById('address-input').value;
            const btn = document.getElementById('generate-btn');
            const loading = document.getElementById('loading-container');
            
            if (!address) return;

            btn.disabled = true;
            loading.style.display = 'block';
            
            if (currentModel) scene.remove(currentModel);

            try {
                const response = await fetch(`/api/generate-site?address=${encodeURIComponent(address)}`);
                if (!response.ok) throw new Error("Backend pipeline failed");
                
                const data = await response.json();
                loadReconstructedMesh(data.mesh_url, data.lot_dimensions[0]);
                
            } catch (error) {
                alert(`Error: ${error.message}`);
                console.error(error);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // --- 3. 3D Instantiation ---
        function loadReconstructedMesh(url, targetWidthMeters) {
            const loader = new GLTFLoader();
            loader.load(url, (gltf) => {
                currentModel = gltf.scene;

                // 1. Flip from CV coordinates to WebGL coordinates
                currentModel.rotation.x = Math.PI;
                currentModel.updateMatrixWorld(true);

                // Adjust Point Cloud rendering properties
                currentModel.traverse((child) => {
                    if (child.isPoints) {
                        child.material.size = 0.22; 
                        child.material.sizeAttenuation = true;
                    }
                });

                // 2. Calculate initial size to determine scale factor
                let box = new THREE.Box3().setFromObject(currentModel);
                let size = box.getSize(new THREE.Vector3());
                
                // 3. Scale FIRST
                const scaleFactor = targetWidthMeters / size.x;
                currentModel.scale.set(scaleFactor, scaleFactor, scaleFactor);
                currentModel.updateMatrixWorld(true);

                // 4. Recalculate bounding box AFTER scaling
                box.setFromObject(currentModel);
                const center = box.getCenter(new THREE.Vector3());
                size = box.getSize(new THREE.Vector3());

                // 5. Shift model so its absolute center sits exactly at (0,0,0)
                currentModel.position.x -= center.x;
                currentModel.position.z -= center.z;
                
                // 6. Rest it exactly on the ground grid
                currentModel.position.y -= center.y;
                currentModel.position.y += size.y / 2;

                scene.add(currentModel);

                // 7. Frame the camera dynamically around the new model
                controls.target.set(0, size.y * 0.4, 0);
                camera.position.set(0, size.y * 0.8, size.y * 2.0);
                controls.update();

            }, undefined, (error) => {
                console.error("Error loading GLB:", error);
            });
        }

        // --- 4. Render Loop ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
